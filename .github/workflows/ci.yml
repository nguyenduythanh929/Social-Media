name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  backend:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - identity-service
          - profile-service
          - post-service
          - file-service
          - chat-service
          - notification-service
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 22
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '22'
          cache: 'maven'
          cache-dependency-path: ${{matrix.service}}/pom.xml

      - name: Build and test
        working-directory: ${{matrix.service}}
        run: mvn -B verify

  # search-service requires Elasticsearch
  search-service:
    name: Build search-service
    runs-on: ubuntu-latest

    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.2.8

        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m

        ports:
          - 9200:9200

        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 22
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '22'
          cache: maven
          cache-dependency-path: search-service/pom.xml

      - name: Build and test
        working-directory: search-service
        run: mvn -B verify
    
  frontend:
    name: Build web-app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - name: Install Dependencies
        working-directory: web-app
        run: npm ci

      - name: Build
        working-directory: web-app
        run: npm run build
        env:
          CI: false



