server:
  port: 8089
  servlet:
    context-path: /profile
spring:
  neo4j:
    uri: bolt://${INFRA_HOST:localhost}:7687
    authentication:
      username: neo4j
      password: ${NEO4J_PASSWORD:spring+neo4j}
  kafka:
    bootstrap-servers: ${INFRA_HOST:localhost}:9094

app:
  services:
    file: http://localhost:8092