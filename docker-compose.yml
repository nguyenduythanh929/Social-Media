services:
  # ================= INFRASTRUCTURE =================
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: identity_service
    ports: ["3308:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      retries: 12

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 12

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD}' 'RETURN 1'"]
      interval: 10s
      retries: 12

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_VERSION}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["9200:9200"]
    volumes: [es_data:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health"]
      interval: 10s
      retries: 12

  kafka:
    image: apache/kafka:3.7.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      # PLAINTEXT is for containers. EXTERNAL is for apps outside Docker (e.g. IntelliJ).
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
    ports: ["9094:9094"]
    volumes: [kafka_data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      retries: 12

  # ================= SERVICES =================
  identity-service:
    build: ./identity-service
    restart: on-failure
    depends_on:
      mysql: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/identity_service
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:9092
      APP_SERVICES_PROFILE: http://profile-service:8089/profile
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}

  profile-service:
    build: ./profile-service
    restart: on-failure
    depends_on:
      neo4j: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: ${NEO4J_PASSWORD}
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:9092
      APP_SERVICES_FILE: http://file-service:8092

  notification-service:
    build: ./notification-service
    restart: on-failure
    depends_on:
      mongo: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      SPRING_MONGODB_URI: mongodb://root:${MONGO_PASSWORD}@mongo:27017/notification-service?authSource=admin
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:9092
      SENDINBLUE_API_KEY: ${SENDINBLUE_API_KEY}

  post-service:
    build: ./post-service
    restart: on-failure
    depends_on:
      mongo: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      SPRING_MONGODB_URI: mongodb://root:${MONGO_PASSWORD}@mongo:27017/post-service?authSource=admin
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:9092
      APP_SERVICES_PROFILE_URL: http://profile-service:8089/profile
      FILE_DOWNLOAD_PREFIX: /api/v1/file/media/download/     # must match file-service

  file-service:
    build: ./file-service
    restart: on-failure
    depends_on:
      mongo: { condition: service_healthy }
    environment:
      SPRING_MONGODB_URI: mongodb://root:${MONGO_PASSWORD}@mongo:27017/file-service?authSource=admin
      FILE_STORAGE_DIR: /app/upload
      FILE_DOWNLOAD_PREFIX: /api/v1/file/media/download/     # relative, so it works on any host
    volumes: [file_uploads:/app/upload]

  chat-service:
    build: ./chat-service
    restart: on-failure
    depends_on:
      mongo: { condition: service_healthy }
    environment:
      SPRING_MONGODB_URI: mongodb://root:${MONGO_PASSWORD}@mongo:27017/chat-service?authSource=admin
      APP_SERVICES_PROFILE_URL: http://profile-service:8089/profile
      APP_SERVICES_IDENTITY_URL: http://identity-service:8088/identity

  search-service:
    build: ./search-service
    restart: on-failure
    depends_on:
      elasticsearch: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:9092
      JWT_SIGNER_KEY: ${JWT_SIGNER_KEY}

  api-gateway:
    build: ./api-gateway
    restart: on-failure
    ports: ["8888:8888"]          # published for Postman; the browser goes through web-app
    depends_on: [identity-service]
    environment:
      IDENTITY_SERVICE_URL: http://identity-service:8088
      PROFILE_SERVICE_URL: http://profile-service:8089
      NOTIFICATION_SERVICE_URL: http://notification-service:8090
      POST_SERVICE_URL: http://post-service:8091
      FILE_SERVICE_URL: http://file-service:8092
      CHAT_SERVICE_URL: http://chat-service:8093
      SEARCH_SERVICE_URL: http://search-service:8095

  web-app:
    build: ./web-app
    restart: on-failure
    ports: ["${WEB_PORT:-3000}:80"]
    depends_on: [api-gateway, chat-service]

volumes:
  mysql_data:
  mongo_data:
  neo4j_data:
  es_data:
  kafka_data:
  file_uploads:
