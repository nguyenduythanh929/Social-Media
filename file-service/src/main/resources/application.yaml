server:
  port: 8092
  servlet:
    context-path: /file

spring:
  application:
    name: file-service
  mongodb:
    uri: mongodb://root:root@192.168.0.111:27017/file-service?authSource=admin
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  file:
    storage-dir: D:/Microservice/social-media/upload
    download-prefix: http://localhost:8888/api/v1/file/media/download/
